<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clases de exposición, tipo de hormigón y recubrimientos (Código Estructural) | TARSEN</title>
  <meta name="description" content="Calcula gratis la clase de exposición, la designación del hormigón y el recubrimiento nominal según el Código Estructural, respondiendo unas preguntas.">
  <link rel="icon" href="../shared/brand/TARSEN-COLOR-Isologo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/estilos.css">
</head>
<body>
  <div data-ui="cabecera"></div>
  <main class="contenedor estrecho">
    <h1>Clases de exposición y recubrimientos del hormigón</h1>
    <p class="entradilla">Responde unas preguntas y obtén la designación del hormigón y el recubrimiento que pide el Código Estructural.</p>

    <!-- Cuestionario (una pregunta por pantalla, avance automático) -->
    <section class="paso" id="p-preguntas"><div id="asistente" aria-live="polite"></div></section>

    <!-- Resultado + respuestas editables (recalcula al cambiar) -->
    <section class="paso" id="p-resultados" hidden>
      <div id="res" aria-live="polite"></div>
      <h2 class="pregunta subtitulo">Tus respuestas</h2>
      <p class="nota">Cambia cualquier dato y el resultado se recalcula al momento.</p>
      <form id="f" class="respuestas" onsubmit="return false"></form>
      <div class="botonera"><button class="btn" type="button" id="reiniciar">Empezar de nuevo</button></div>
      <div data-ui="cta"></div>
    </section>

    <div data-ui="aviso"></div>
  </main>
  <div data-ui="pie"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
